<head>

  <link rel="icon" type="image/png" sizes="32x32" href="/landing/assets/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="/landing/assets/favicon-q.ico?v=15.91">
  <link rel="apple-touch-icon" sizes="192x192" href="/landing/assets/favicon-192x192.png">

  <!-- Fontes do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Philosopher:wght@400;700&family=MedievalSharp&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Philosopher:wght@400;700&family=MedievalSharp&display=swap" media="print" onload="this.media='all'">

  <style>
    /* Estilos de backup caso style.css não carregue ou falhe offline */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0a1020 0%, #060d18 100%);
      color: #d5e2ff;
      font-family: 'Philosopher', system-ui, -apple-system, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .nq-off-container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    .nq-off-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 215, 0, 0.03);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 12px;
      padding: 12px 18px;
      margin-top: 10px;
    }

    .nq-off-title {
      font-size: 1.1rem;
      color: #ffd700;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nq-off-sync-banner {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.76rem;
      color: #93c5fd;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nq-off-card {
      background: linear-gradient(180deg, #161d30, #0d1424);
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nq-off-topic {
      display: inline-block;
      align-self: flex-start;
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nq-off-question {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      color: #fff;
    }

    .nq-off-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nq-off-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 1.5px solid #334155;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      color: #d5e2ff;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .nq-off-btn:hover:not(:disabled) {
      border-color: #ffd700;
      background: linear-gradient(180deg, #1e3a5f, #0f172a);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
    }

    .nq-off-btn:disabled {
      cursor: default;
      opacity: 0.8;
    }

    .nq-off-btn.correct {
      border-color: #34d399 !important;
      background: rgba(52, 211, 153, 0.15) !important;
      color: #34d399 !important;
    }

    .nq-off-btn.wrong {
      border-color: #fb7185 !important;
      background: rgba(251, 113, 133, 0.15) !important;
      color: #fb7185 !important;
    }

    .nq-off-feedback {
      border-radius: 10px;
      padding: 16px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .nq-off-feedback.good {
      background: rgba(52, 211, 153, 0.08);
      border: 1.5px solid rgba(52, 211, 153, 0.3);
      color: #d1fae5;
    }

    .nq-off-feedback.bad {
      background: rgba(251, 113, 133, 0.08);
      border: 1.5px solid rgba(251, 113, 133, 0.3);
      color: #ffe4e6;
    }

    .btn-next {
      background: linear-gradient(180deg, #ffd700, #b8860b);
      border: 1px solid #ffd700;
      color: #000;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: center;
      transition: opacity 0.2s;
    }

    .btn-next:hover {
      opacity: 0.9;
    }

    /* Floating Text Styles */
    .floating-text {
      position: fixed;
      font-weight: bold;
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 100000;
      animation: nq-float-up 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }
    .floating-text.correct { color: #34d399; }
    .floating-text.wrong { color: #fb7185; }

    @keyframes nq-float-up {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      15% { transform: translate(-50%, -50%) translateY(-20px) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50%) translateY(-100px) scale(0.85); opacity: 0; }
    }
  </style>

<body>

  <div class="nq-off-container">
    <!-- Header -->
    <div class="nq-off-header">
      <div class="nq-off-title">
        <span>📡</span> Estudo Offline
      </div>
      <div style="font-size:0.75rem; color:#ffd700; font-weight:bold; letter-spacing:0.5px;" id="nqOffCounters">
        Acertos: <span id="nqOffCorrectCount">0</span>
      </div>
    </div>

    <!-- Banner informativo de sincronização -->
    <div class="nq-off-sync-banner">
      <span style="font-size:1.2rem;">⚡</span>
      <div>
        <strong>Modo Offline Ativo:</strong> Todo o progresso obtido nesta página será salvo localmente e sincronizado automaticamente com a nuvem (Supabase) assim que você se conectar à internet.
      </div>
    </div>

    <!-- Question Card -->
    <div class="nq-off-card" id="nqOffCard">
      <div style="text-align:center; padding:40px; color:#90b4e0;" id="nqOffLoading">
        Carregando banco de dados de questões offline...
      </div>
    </div>
  </div>

  <!-- Banco de dados de questões (topics) em cache -->
  <script>window.NQ_REQUIRES_QUESTION_REVISIONS = true;</script>
  <script src="/js/answer-presentation.js?v=16.09"></script>
  <script src="/data/question-revision-manifest.js?v=16.10"></script>
  <script src="/data/question-revision-history.js?v=16.10"></script>
  <script src="/js/question-revisions.js?v=16.10"></script>
  <script src="/data/topics.js"></script>
  <script>
    // Inicialização da sessão
    let sessionQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let isAnswered = false;
    let currentPresentation = null;
    let offlineAnswer = null;
    let offlineRevision = null;
    let offlineCatalog = null;
    let offlineOriginalRaw = null;
    let offlineConsultationOnly = false;
    let offlineSelection = null;
    let offlineSelectionRaw = null;
    let offlineSavedRaw = null;
    let offlineRevisionHold = null;
    function getOfflineRevisionCatalog() {
      if (!window.NQ_REQUIRES_QUESTION_REVISIONS && !window.NQQuestionRevisions && !window.NQQuestionRevisionManifest && !window.NQQuestionRevisionHistory) return undefined;
      if (!window.NQQuestionRevisions || !window.NQQuestionRevisionManifest || !Array.isArray(window.NQQuestionRevisionHistory) || typeof topics === 'undefined') return null;
      if (!offlineCatalog) {
        try {
          // Offline has no reference-card UI; the manifest still pins their published identities.
          offlineCatalog = window.NQQuestionRevisions.createCatalog({
            manifest: window.NQQuestionRevisionManifest, history: window.NQQuestionRevisionHistory || [],
            authors: topics, sources: {offline: topics.map(offlineCanonical)}
          });
        } catch (error) { console.error('[NQ] Offline revision catalog unavailable', error); }
      }
      return offlineCatalog;
    }
    const OFFLINE_STUDY_SAVE_KEY = 'nefroquest-offline-study-state';

    const cardContainer = document.getElementById('nqOffCard');
    const correctVal = document.getElementById('nqOffCorrectCount');

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }

    function shuffle(array) {
      let cur = array.length, rand;
      while (cur !== 0) {
        rand = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rand]] = [array[rand], array[cur]];
      }
      return array;
    }

    function offlineCanonical(q) {
      return { id: q.qid, q: q.q, o: [...q.opts], a: q.ans, e: q.exp || q.e || '' };
    }

    function saveOfflineSession() {
      if (!currentPresentation || !sessionQuestions[currentIndex] || offlineConsultationOnly) return false;
      const catalog = getOfflineRevisionCatalog();
      if (catalog === null || (catalog && !catalog.resolve(currentPresentation, {profile: 'offline', binding: offlineRevision?.binding}))) return false;
      const question = window.NQAnswers ? window.NQAnswers.snapshot(currentPresentation) : currentPresentation;
      if (!question) return false;
      const expectedRaw = offlineSavedRaw, presentation = currentPresentation, questions = sessionQuestions, index = currentIndex;
      const current = () => offlineSavedRaw === expectedRaw && currentPresentation === presentation && sessionQuestions === questions && currentIndex === index;
      let raw, candidateWritten = false;
      try {
        if (!current() || localStorage.getItem(OFFLINE_STUDY_SAVE_KEY) !== expectedRaw) return false;
        raw = JSON.stringify({
          version: 1, questionIds: sessionQuestions.map(q => q.qid),
          index: currentIndex, correctCount, question, answer: offlineAnswer,
          ...(offlineRevision?.binding ? {revisionBinding: offlineRevision.binding} : {}),
          ...(offlineOriginalRaw ? {revisionOriginRaw: offlineOriginalRaw} : {})
        });
        if (!current() || localStorage.getItem(OFFLINE_STUDY_SAVE_KEY) !== expectedRaw) return false;
        localStorage.setItem(OFFLINE_STUDY_SAVE_KEY, raw);
        candidateWritten = true;
        if (!current() || localStorage.getItem(OFFLINE_STUDY_SAVE_KEY) !== raw) throw new Error('Offline save readback mismatch.');
        offlineSavedRaw = raw;
        return true;
      } catch (e) {
        if (candidateWritten) {
          try {
            if (current() && localStorage.getItem(OFFLINE_STUDY_SAVE_KEY) === raw) {
              if (expectedRaw === null) localStorage.removeItem(OFFLINE_STUDY_SAVE_KEY);
              else localStorage.setItem(OFFLINE_STUDY_SAVE_KEY, expectedRaw);
            }
          } catch (_) { /* Do not overwrite a source that cannot be confirmed. */ }
        }
        return false;
      }
    }

    function restoreOfflineSession() {
      let raw;
      try { raw = localStorage.getItem(OFFLINE_STUDY_SAVE_KEY); } catch (e) { return null; }
      if (!raw) return null;
      try {
        const saved = JSON.parse(raw);
        if (saved.version !== 1 || !Array.isArray(saved.questionIds) || !saved.questionIds.length ||
            !Number.isInteger(saved.index) || saved.index < 0 || saved.index >= saved.questionIds.length ||
            !Number.isSafeInteger(saved.correctCount) || saved.correctCount < 0) return false;
        const byId = new Map(topics.map(q => [q.qid, q]));
        const questions = saved.questionIds.map(id => byId.get(id));
        if (questions.some(q => !q)) return false;
        const catalog = getOfflineRevisionCatalog();
        if (catalog === null) { offlineRevisionHold = {status: 'unavailable', candidates: []}; return false; }
        if (offlineSelectionRaw !== raw) { offlineSelection = null; offlineSelectionRaw = raw; }
        let resolved;
        if (catalog) {
          const binding = Object.prototype.hasOwnProperty.call(saved, 'revisionBinding') ? saved.revisionBinding : offlineSelection || undefined;
          const checked = catalog.inspect(saved.question, {profile: 'offline', binding});
          if (checked.status !== 'known') { offlineRevisionHold = checked; return false; }
          resolved = checked.value;
        }
        const authored = offlineCanonical(questions[saved.index]);
        const presentation = resolved?.question || (window.NQAnswers ? window.NQAnswers.restore(saved.question, authored)
          : (!saved.question?._answerPresentation ? saved.question : null));
        if (!presentation) return false;
        const answer = saved.answer;
        if (answer) {
          if (!Number.isInteger(answer.chosen) || answer.chosen < 0 || answer.chosen >= presentation.o.length ||
              answer.correct !== (answer.chosen === presentation.a) ||
              answer.authoredChoice !== (window.NQAnswers ? window.NQAnswers.originalIndex(presentation, answer.chosen) : answer.chosen) ||
              answer.optionId !== (window.NQAnswers ? window.NQAnswers.optionId(presentation, answer.chosen) : null)) return false;
        }
        if (String(presentation.id) !== String(saved.questionIds[saved.index])) return false;
        if (resolved) questions[saved.index] = resolved.author;
        sessionQuestions = questions;
        offlineRevision = resolved || null;
        offlineOriginalRaw = saved.revisionOriginRaw || raw;
        offlineSavedRaw = raw;
        offlineConsultationOnly = !!offlineSelection;
        offlineRevisionHold = null;
        currentIndex = saved.index;
        correctCount = saved.correctCount;
        currentPresentation = presentation;
        offlineAnswer = answer || null;
        return true;
      } catch (e) { return false; }
    }

    function startNewOfflineSession() {
      let expectedRaw;
      try { expectedRaw = localStorage.getItem(OFFLINE_STUDY_SAVE_KEY); } catch (_) { return false; }
      sessionQuestions = shuffle([...topics]);
      currentIndex = 0;
      correctCount = 0;
      currentPresentation = null;
      offlineAnswer = null;
      offlineRevision = null;
      offlineOriginalRaw = null;
      offlineConsultationOnly = false;
      offlineSelection = null;
      offlineSelectionRaw = null;
      offlineSavedRaw = expectedRaw;
      offlineRevisionHold = null;
      renderQuestion();
    }

    function consultOfflineRevision(recordRevision) {
      const catalog = getOfflineRevisionCatalog();
      if (!catalog || !offlineSelectionRaw || localStorage.getItem(OFFLINE_STUDY_SAVE_KEY) !== offlineSelectionRaw) return false;
      const saved = JSON.parse(offlineSelectionRaw), checked = catalog.inspect(saved.question, {profile: 'offline'});
      const chosen = checked.candidates?.find(candidate => candidate.binding.recordRevision === recordRevision);
      if (checked.status !== 'ambiguous' || !chosen) return false;
      offlineSelection = chosen.binding;
      if (!restoreOfflineSession()) return false;
      renderQuestion(true);
      return true;
    }
    function useCurrentOfflineRevision() {
      if (offlineConsultationOnly || offlineAnswer || !offlineRevision?.historical || offlineRevision.policy.pending !== 'update-required') return false;
      const current = getOfflineRevisionCatalog()?.current(offlineRevision.binding.qid, 'offline');
      if (!current) return false;
      try { if (localStorage.getItem(OFFLINE_STUDY_SAVE_KEY) !== offlineSavedRaw) return false; }
      catch (_) { return false; }
      const presentation = window.NQAnswers.present(current.source);
      if (!presentation) return false;
      const previousAuthor = sessionQuestions[currentIndex], previousPresentation = currentPresentation, previousRevision = offlineRevision;
      sessionQuestions[currentIndex] = current.author;
      currentPresentation = presentation;
      offlineRevision = current;
      if (!saveOfflineSession()) {
        sessionQuestions[currentIndex] = previousAuthor;
        currentPresentation = previousPresentation;
        offlineRevision = previousRevision;
        return false;
      }
      renderQuestion(true);
      return true;
    }
    function viewCurrentOfflineRevision() {
      const current = getOfflineRevisionCatalog()?.current(sessionQuestions[currentIndex]?.qid, 'offline');
      if (!current) return;
      document.getElementById('nqOffCurrentRevision')?.remove();
      const panel = document.createElement('section');
      panel.id = 'nqOffCurrentRevision';
      panel.innerHTML = `<h3>Atualização publicada (${escapeHtml(current.release)})</h3><p>Consulta separada; sua avaliação histórica permanece preservada.</p><p>${escapeHtml(current.author.q)}</p><p>${escapeHtml(current.source.e || '')}</p>`;
      cardContainer.appendChild(panel);
    }

    function initOfflineStudy() {
      if (typeof topics === 'undefined' || !Array.isArray(topics) || topics.length === 0) {
        cardContainer.innerHTML = `
          <div style="text-align:center; padding:32px; color:#fb7185;">
            <div style="font-size:2.5rem; margin-bottom:12px;">⚠️</div>
            <strong>Erro ao carregar banco de dados</strong>
            <p style="font-size:0.8rem; color:rgba(251,113,133,0.7); margin-top:8px;">O arquivo de questões (/data/topics.js) ainda não foi armazenado no cache local. Conecte-se e abra o app para carregá-lo.</p>
            <button onclick="location.reload()" style="margin-top:16px; padding:10px 20px; background:#ef4444; border:none; color:#fff; border-radius:8px; font-weight:bold; cursor:pointer;">Tentar Novamente</button>
          </div>
        `;
        return;
      }

      const restored = restoreOfflineSession();
      if (restored === false) {
        const choices = offlineRevisionHold?.status === 'ambiguous' ? '<p>Escolha uma versão publicada para consulta, sem alterar respostas ou progresso.</p>' + offlineRevisionHold.candidates.map(candidate =>
          `<button class="btn-next" onclick="consultOfflineRevision('${candidate.binding.recordRevision}')">${candidate.historical ? 'Consultar versão histórica' : 'Consultar versão atual'} (${escapeHtml(candidate.release)})</button>`).join('') : '';
        cardContainer.innerHTML = choices + '<p role="alert">Não foi possível conferir a sessão offline salva. Ela foi preservada.</p><button class="btn-next" onclick="startNewOfflineSession()">Iniciar nova sessão offline</button>';
        return;
      }
      if (restored) renderQuestion(true);
      else startNewOfflineSession();
    }

    function renderQuestion(restoring = false) {
      if (currentIndex >= sessionQuestions.length) {
        // Reiniciar se acabar
        sessionQuestions = shuffle([...topics]);
        currentIndex = 0;
      }

      const q = sessionQuestions[currentIndex];
      if (!restoring) {
        const authored = offlineCanonical(q);
        currentPresentation = window.NQAnswers ? window.NQAnswers.present(authored) : authored;
        offlineAnswer = null;
        const catalog = getOfflineRevisionCatalog();
        offlineRevision = catalog?.current(q.qid, 'offline') || null;
        if (catalog === null || (catalog && !offlineRevision)) currentPresentation = null;
      }
      if (!currentPresentation) {
        cardContainer.innerHTML = '<p role="alert">Não foi possível conferir as alternativas desta questão.</p>';
        return;
      }
      const held = offlineConsultationOnly || (offlineRevision?.historical && offlineRevision.policy.pending === 'update-required' && !offlineAnswer);
      isAnswered = !!offlineAnswer;
      correctVal.textContent = correctCount;
      
      cardContainer.innerHTML = `
        ${offlineRevision?.historical ? `<p role="status">Versão histórica (${escapeHtml(offlineRevision.release)}). ${offlineAnswer ? 'Avaliação preservada; esta explicação pertence à versão respondida.' : 'Esta questão foi atualizada. Use a versão atual antes de responder.'}</p><button class="btn-next" onclick="viewCurrentOfflineRevision()">Consultar atualização publicada</button>` : ''}
        ${offlineConsultationOnly ? '<p role="status">Consulta de uma revisão escolhida. Respostas e progresso da sessão salva permanecem intactos.</p>' : ''}
        ${held && !offlineConsultationOnly ? '<button class="btn-next" onclick="useCurrentOfflineRevision()">Confirmar troca para a versão atual, sem consumir resposta</button>' : ''}
        <div class="nq-off-topic">${escapeHtml(q.cat || 'Geral')}</div>
        <div class="nq-off-question">${escapeHtml(q.q)}</div>
        <div class="nq-off-options" id="nqOffOptions">
          ${currentPresentation.o.map((opt, idx) => `
            <button class="nq-off-btn" data-idx="${idx}" ${held ? 'disabled' : ''}>
              <span>${escapeHtml(opt)}</span>
              <span style="font-size:0.75rem; opacity:0.6; margin-left:10px;">${String.fromCharCode(65 + idx)}</span>
            </button>
          `).join('')}
        </div>
        <div id="nqOffFeedbackArea" style="display:none; flex-direction:column; gap:16px;"></div>
      `;

      // Adicionar listeners nos botões
      const btns = cardContainer.querySelectorAll('.nq-off-btn');
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx, 10);
          answerQuestion(idx, btn);
        });
      });
      if (offlineAnswer) displayOfflineAnswer(offlineAnswer.chosen, null, false);
      if (!restoring) saveOfflineSession();
    }

    function answerQuestion(selectedIdx, clickedBtn) {
      if (offlineConsultationOnly || (offlineRevision?.historical && offlineRevision.policy.pending === 'update-required')) return;
      if (isAnswered || !currentPresentation || !Number.isInteger(selectedIdx) || selectedIdx < 0 || selectedIdx >= currentPresentation.o.length) return;
      isAnswered = true;
      offlineAnswer = {
        chosen: selectedIdx, correct: selectedIdx === currentPresentation.a,
        authoredChoice: window.NQAnswers ? window.NQAnswers.originalIndex(currentPresentation, selectedIdx) : selectedIdx,
        optionId: window.NQAnswers ? window.NQAnswers.optionId(currentPresentation, selectedIdx) : null
      };
      displayOfflineAnswer(selectedIdx, clickedBtn, true);
    }

    function displayOfflineAnswer(selectedIdx, clickedBtn, recordProgress) {
      if (recordProgress && (offlineConsultationOnly || offlineRevision?.historical)) return;
      const q = sessionQuestions[currentIndex];
      const isCorrect = offlineAnswer.correct;

      // Desabilitar botões e pintar cores
      const btns = document.querySelectorAll('.nq-off-btn');
      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === currentPresentation.a) {
          btn.classList.add('correct');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      // Disparar floating text
      let x, y;
      if (clickedBtn) {
        const rect = clickedBtn.getBoundingClientRect();
        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;
      }
      if (recordProgress) showFloatingText(isCorrect ? '✓ Correto!' : '✗ Incorreto', isCorrect, x, y);

      if (recordProgress && isCorrect) {
        correctCount++;
        correctVal.textContent = correctCount;
      }

      // Persistir progresso localmente
      if (recordProgress) persistProgress(q, isCorrect);
      if (recordProgress) saveOfflineSession();

      // Exibir feedback
      const feedbackArea = document.getElementById('nqOffFeedbackArea');
      feedbackArea.style.display = 'flex';
      feedbackArea.innerHTML = `
        <div class="nq-off-feedback ${isCorrect ? 'good' : 'bad'}">
          <strong style="display:block; margin-bottom:6px;">${isCorrect ? '✅ Resposta Correta!' : '❌ Resposta Incorreta'}</strong>
          <p>${escapeHtml(currentPresentation.e || 'A resposta correta é a alternativa ' + String.fromCharCode(65 + currentPresentation.a) + '.')}</p>
        </div>
        <button class="btn-next" onclick="nextQuestion()">Próxima Questão</button>
      `;
    }

    function nextQuestion() {
      if (offlineConsultationOnly || !offlineAnswer) return;
      currentIndex++;
      renderQuestion();
    }

    function showFloatingText(text, isCorrect, x, y) {
      const el = document.createElement('div');
      el.className = 'floating-text ' + (isCorrect ? 'correct' : 'wrong');
      el.textContent = text;
      el.style.left = (x !== undefined ? x : window.innerWidth / 2) + 'px';
      el.style.top = (y !== undefined ? y : window.innerHeight / 2) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    function persistProgress(question, isCorrect) {
      // 1. Adicionar ao mastered-ids se correto
      if (isCorrect) {
        try {
          const mastered = JSON.parse(localStorage.getItem('nefroquest-mastered-ids') || '[]');
          if (!mastered.includes(question.qid)) {
            mastered.push(question.qid);
            localStorage.setItem('nefroquest-mastered-ids', JSON.stringify(mastered));
          }
        } catch (e) {}
      }

      // 2. Adicionar ao all-answered-qids
      try {
        const answered = JSON.parse(localStorage.getItem('nefroquest-all-answered-qids') || '[]');
        if (!answered.includes(question.qid)) {
          answered.push(question.qid);
          localStorage.setItem('nefroquest-all-answered-qids', JSON.stringify(answered));
        }
      } catch (e) {}

      // 3. Atualizar estatísticas detalhadas
      try {
        const stats = JSON.parse(localStorage.getItem('nefroquest-detailed-stats') || '{}');
        if (!stats.byTopic)    stats.byTopic    = {};
        if (!stats.byCategory) stats.byCategory = {};
        if (!stats.questionHistory) stats.questionHistory = [];
        if (!stats.totalQuestions) stats.totalQuestions = 0;
        if (!stats.totalCorrect)   stats.totalCorrect   = 0;
        if (!stats.totalWrong)     stats.totalWrong     = 0;

        const topic = question.t || 'Geral';
        const cat = question.cat || question.c || 'geral';

        stats.totalQuestions++;
        if (isCorrect) stats.totalCorrect++;
        else stats.totalWrong++;

        if (!stats.byTopic[topic]) stats.byTopic[topic] = { correct: 0, wrong: 0, total: 0 };
        stats.byTopic[topic].total++;
        if (isCorrect) stats.byTopic[topic].correct++;
        else stats.byTopic[topic].wrong++;

        if (!stats.byCategory[cat]) stats.byCategory[cat] = { correct: 0, wrong: 0, total: 0 };
        stats.byCategory[cat].total++;
        if (isCorrect) stats.byCategory[cat].correct++;
        else stats.byCategory[cat].wrong++;

        // Unshift para o histórico (últimas 100)
        stats.questionHistory.unshift({
          qid: question.qid,
          topic: topic,
          correct: isCorrect,
          time: 0,
          date: new Date().toISOString()
        });
        if (stats.questionHistory.length > 100) {
          stats.questionHistory = stats.questionHistory.slice(0, 100);
        }

        localStorage.setItem('nefroquest-detailed-stats', JSON.stringify(stats));
      } catch (e) {}
    }

    // Atalhos de teclado (1-4 / A-D e Enter/Espaço)
    document.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
        return; // Ignorar quando digitando
      }

      const key = e.key.toUpperCase();

      if (isAnswered) {
        if (key === 'ENTER' || key === ' ') {
          e.preventDefault();
          nextQuestion();
        }
        return;
      }

      const optionKeys = ['1', '2', '3', '4', 'A', 'B', 'C', 'D'];
      const optIdx = optionKeys.indexOf(key) % 4;
      if (optIdx >= 0) {
        e.preventDefault();
        const btns = document.querySelectorAll('.nq-off-btn');
        if (btns && btns[optIdx] && !btns[optIdx].disabled) {
          btns[optIdx].click();
        }
      }
    });

    // Iniciar
    setTimeout(initOfflineStudy, 200);
  </script>
</body>
</html>
